<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DepEd Teacher's OS v2.0</title>
    <style>
        :root {
            --primary-blue: #0A2540;
            --accent-orange: #FF6B00;
            --bg-white: #F4F7F9;
            --card-white: #FFFFFF;
            --text-main: #333333;
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg-white); overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 280px; background: var(--primary-blue); color: white; display: flex; flex-direction: column; box-shadow: 4px 0 15px rgba(0,0,0,0.1); }
        .sidebar-header { padding: 30px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header h2 { margin: 0; color: var(--accent-orange); font-weight: 800; }
        .sidebar-menu { flex: 1; padding: 20px 15px; }
        .menu-item {
            padding: 14px 20px; margin-bottom: 8px; border-radius: 8px; cursor: pointer;
            transition: 0.3s; display: flex; align-items: center; gap: 12px; font-weight: 600;
        }
        .menu-item:hover { background: rgba(255, 107, 0, 0.1); color: var(--accent-orange); }
        .menu-item.active { background: var(--accent-orange); color: white; }

        /* Main Workspace */
        .main-content { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; }
        .card { background: var(--card-white); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 20px; border-top: 4px solid var(--accent-orange); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        label { font-weight: 700; display: block; margin-bottom: 5px; color: var(--primary-blue); font-size: 0.8rem; text-transform: uppercase; }
        select, input, textarea {
            width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px;
            margin-bottom: 12px; box-sizing: border-box; font-family: inherit;
        }

        .btn {
            padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer;
            font-weight: bold; transition: 0.3s; background: var(--accent-orange); color: white; width: 100%;
        }
        .btn:hover { background: #e65c00; transform: translateY(-1px); }
        .btn-blue { background: var(--primary-blue); margin-top: 10px; }

        /* Preview Area */
        #word-preview {
            background: white; border: 1px solid #ddd; padding: 40px; margin-top: 20px;
            min-height: 500px; font-family: "Times New Roman", serif; overflow-x: auto;
        }

        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--accent-orange); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header"><h2>DEPED OS</h2></div>
    <div class="sidebar-menu">
        <div class="menu-item active" onclick="showTab('planner')">📝 Lesson Planner</div>
        <div class="menu-item" onclick="showTab('tos')">📊 TOS & Quiz</div>
        <div class="menu-item" onclick="showTab('profile')">🏫 School Profile</div>
        <div class="menu-item" onclick="resetApiKey()" style="margin-top: 50px; opacity: 0.6;">⚙️ Reset API Key</div>
    </div>
</div>

<div class="main-content">
    <div class="card" style="border-top-color: var(--primary-blue);">
        <div class="grid-3">
            <div>
                <label>Grade Level</label>
                <select id="grade-level" onchange="toggleSemester()">
                    <option>Grade 1</option><option>Grade 6</option><option>Grade 10</option>
                    <option value="SHS">Grade 11</option><option value="SHS">Grade 12</option>
                </select>
            </div>
            <div>
                <label id="term-label">Quarter</label>
                <select id="term-select">
                    <option>1st Quarter</option><option>2nd Quarter</option>
                </select>
            </div>
            <div>
                <label>Subject</label>
                <input type="text" id="subject" placeholder="e.g. Practical Research 2">
            </div>
        </div>
    </div>

    <div id="planner" class="tab-content active">
        <div class="card">
            <div class="grid-2">
                <div>
                    <label>Format Type</label>
                    <select id="doc-type" onchange="togglePPST()">
                        <option value="DLL">4-Day DLL (Landscape)</option>
                        <option value="SDLP">Semi-Detailed w/ PPST (Portrait)</option>
                    </select>
                </div>
                <div id="ppst-box" style="display:none;">
                    <label>Teaching Position (for PPST)</label>
                    <select id="position">
                        <option value="Proficient">Teacher I - III</option>
                        <option value="Highly Proficient">Master Teacher I - IV</option>
                    </select>
                </div>
            </div>
            <label>Learning Competency (LC)</label>
            <textarea id="lc-input" rows="3" placeholder="Paste LC here..."></textarea>
            <button class="btn" onclick="generateAI('lesson')">✨ Generate Document</button>
        </div>
    </div>

    <div id="profile" class="tab-content">
        <div class="card">
            <label>School Name</label><input type="text" id="prof-school" oninput="saveProfile()">
            <div class="grid-2">
                <div><label>Teacher (Prepared by)</label><input type="text" id="prof-teacher" oninput="saveProfile()"></div>
                <div><label>Checked by</label><input type="text" id="prof-checker" oninput="saveProfile()"></div>
            </div>
            <label>Approved by</label><input type="text" id="prof-approver" oninput="saveProfile()">
        </div>
    </div>

    <div id="loading" style="display:none;"><div class="loader"></div></div>

    <div id="output-section" style="display:none;">
        <div class="card">
            <div id="word-preview"></div>
            <button class="btn btn-blue" onclick="exportToWord()">💾 Download as Word (.doc)</button>
        </div>
    </div>
</div>

<script>
    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function toggleSemester() {
        const isSHS = document.getElementById('grade-level').value === "SHS";
        document.getElementById('term-label').innerText = isSHS ? "Semester" : "Quarter";
        document.getElementById('term-select').innerHTML = isSHS ? 
            `<option>1st Semester</option><option>2nd Semester</option>` : 
            `<option>1st Quarter</option><option>2nd Quarter</option><option>3rd Quarter</option><option>4th Quarter</option>`;
    }

    function togglePPST() {
        const type = document.getElementById('doc-type').value;
        document.getElementById('ppst-box').style.display = (type === "SDLP") ? "block" : "none";
    }

    function saveProfile() {
        const data = {
            school: document.getElementById('prof-school').value,
            teacher: document.getElementById('prof-teacher').value,
            checker: document.getElementById('prof-checker').value,
            approver: document.getElementById('prof-approver').value
        };
        localStorage.setItem('deped_profile_v2', JSON.stringify(data));
    }

    function loadProfile() {
        const data = JSON.parse(localStorage.getItem('deped_profile_v2'));
        if(data) {
            document.getElementById('prof-school').value = data.school || '';
            document.getElementById('prof-teacher').value = data.teacher || '';
            document.getElementById('prof-checker').value = data.checker || '';
            document.getElementById('prof-approver').value = data.approver || '';
        }
    }

    async function generateAI(mode) {
        const apiKey = localStorage.getItem("gamai_key") || prompt("Enter Gemini API Key:");
        if(apiKey) localStorage.setItem("gamai_key", apiKey); else return;

        document.getElementById('loading').style.display = "block";
        const docType = document.getElementById('doc-type').value;
        const pos = document.getElementById('position').value;
        const lc = document.getElementById('lc-input').value;
        
        let prompt = `Act as a DepEd Master Teacher. Generate a ${docType} for ${document.getElementById('subject').value}. 
        LC: ${lc}. 
        ${docType === 'DLL' ? 'Format as a 4-day horizontal table (Day 1-4) following Sections I-VI (Objectives, Content, Resources, Procedures A-J, Remarks, Reflection).' : 
        'Format as a vertical SDLP with 3 columns: Procedures, Teacher Activity, and PPST Annotations for a ' + pos + ' teacher stage.'}
        Return strictly HTML code. No markdown formatting.`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const resData = await response.json();
            let aiHtml = resData.candidates[0].content.parts[0].text.replace(/```html|```/g, '');
            document.getElementById('word-preview').innerHTML = aiHtml;
            document.getElementById('output-section').style.display = "block";
        } catch (e) { alert("Error: " + e.message); }
        document.getElementById('loading').style.display = "none";
    }

    function exportToWord() {
        const isLandscape = document.getElementById('doc-type').value === "DLL";
        const p = JSON.parse(localStorage.getItem('deped_profile_v2')) || {};
        const content = document.getElementById('word-preview').innerHTML;

        const docHtml = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word'>
        <head><meta charset='utf-8'>
        <style>
            @page { size: 13in 8.5in; margin: 0.5in; mso-page-orientation: ${isLandscape ? 'landscape' : 'portrait'}; }
            body { font-family: "Times New Roman", serif; font-size: 10pt; }
            table { width: 100%; border-collapse: collapse; margin-top: 10px; }
            th, td { border: 1px solid black; padding: 4px; vertical-align: top; }
            .header { text-align: center; font-weight: bold; margin-bottom: 20px; }
        </style>
        </head><body>
        <div class="header">Republic of the Philippines<br>Department of Education<br>${p.school || 'NAME OF SCHOOL'}</div>
        ${content}
        <div style="margin-top:30px;">
            <p>Prepared by: <b>${p.teacher}</b></p>
            <p>Checked by: <b>${p.checker}</b></p>
            <p>Approved by: <b>${p.approver}</b></p>
        </div>
        </body></html>`;

        const blob = new Blob(['\ufeff', docHtml], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `DepEd_Doc_${Date.now()}.doc`;
        link.click();
    }

    window.onload = loadProfile;
    function resetApiKey() { localStorage.removeItem("gamai_key"); alert("Cleared"); }
</script>
</body>
</html>
